name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the Project Brief sets. Testing both ends catches
        # version-specific breakage before a grader does.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # A12: the single documented command. No API key is set here on purpose —
      # the suite must pass on a clean checkout before credentials exist.
      - name: Run tests
        run: pytest --cov=src --cov=evaluation --cov-report=term-missing:skip-covered

  secrets:
    # NFR-04: no credential may appear in the source or its history. A key found
    # is a serious finding whether or not it still works, so we check ourselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and history for credentials
        run: |
          set -euo pipefail

          # Real key shapes, not the word "key". Placeholders in .env.example
          # are expected and must not trip this.
          PATTERN='(gsk_[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})'

          echo "--- scanning tracked files ---"
          if git grep -nIE "$PATTERN" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string was found in tracked files."
            exit 1
          fi

          echo "--- scanning committed history ---"
          if git log -p --all | grep -nIE "$PATTERN"; then
            echo "::error::A credential-shaped string was found in git history."
            exit 1
          fi

          echo "No credentials found."

      - name: Fail if .env was ever committed
        run: |
          if git log --all --name-only --pretty=format: | sort -u | grep -qx '.env'; then
            echo "::error::.env appears in the repository history."
            exit 1
          fi
          echo ".env is absent from history, as required."
